---
- name: Harden Server
  vars_files:
    - ../{{ansible_stage}}/group_vars/secrets.yml
    - ../{{ansible_stage}}/group_vars/2_playbook_vars.yml
  hosts: all
  gather_facts: true

  remote_user: "{{deploy_user}}"
  become: yes

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

  roles:
    - geerlingguy.security

  tasks:
    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: 22

    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: 80

    - name: Allow HTTPS
      community.general.ufw:
        rule: allow
        port: 443

    - name: Enable UFW and set default policy
      community.general.ufw:
        state: enabled
        policy: deny
